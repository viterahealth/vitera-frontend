<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Height &amp; Weight — VITERA</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <style>
    .bmi-display {
      margin-top: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--vt-green-700);
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="brand">
      <img src="assets/images/logo.png" alt="VITERA">
      <span class="wordmark">VITERA<span class="dot">.</span></span>
    </div>
    <div class="nav-right">
      <a class="btn btn-text" href="dashboard.html">&larr; Dashboard</a>
      <button class="btn btn-text" id="logout-btn">Log out</button>
    </div>
  </div>

  <div class="container narrow">

    <div class="card">
      <h1>Height &amp; Weight</h1>
      <p class="subtitle">Stall 2 — search for a checked-in patient to record height and weight.</p>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search name, phone, or code…">
      </div>
      <div class="search-results" id="search-results"></div>
    </div>

    <div class="card hidden" id="form-card">
      <div class="patient-header">
        <div>
          <h2 id="p-name" style="color:var(--vt-text); margin-bottom:2px;"></h2>
          <div class="code" id="p-meta"></div>
        </div>
        <span class="status-pill" id="p-status"></span>
      </div>

      <div class="row">
        <div>
          <label for="height_cm">Height (cm)</label>
          <input type="number" step="0.1" id="height_cm">
        </div>
        <div>
          <label for="weight_kg">Weight (kg)</label>
          <input type="number" step="0.1" id="weight_kg">
        </div>
      </div>

      <div class="bmi-display" id="bmi-display">BMI: —</div>

      <button class="btn btn-primary btn-block" id="save-btn" style="margin-top:20px;">
        Save
      </button>
    </div>

  </div>

  <script type="module" src="assets/js/vitals-height-weight.js"></script>
</body>
</html>
