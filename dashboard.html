<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — VITERA</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>
  <div class="navbar">
    <div class="brand">
      <img src="assets/images/logo.png" alt="VITERA">
      <span class="wordmark">VITERA<span class="dot">.</span></span>
    </div>
    <div class="nav-right">
      <span class="role-badge" id="role-badge"></span>
      <span class="user-chip">Signed in as <strong id="user-name"></strong></span>
      <button class="btn btn-text" id="logout-btn">Log out</button>
    </div>
  </div>

  <div class="container">

    <div class="card">
      <h2>Active camp</h2>
      <p class="subtitle">Everything below applies to this camp. Pick it once per shift.</p>
      <div class="camp-select-row">
        <select id="camp-select">
          <option value="">Loading camps…</option>
        </select>
      </div>
      <div id="camp-empty-hint" class="empty-hint hidden">
        No camps found. Ask an admin to create one first.
      </div>
    </div>

    <div class="card">
      <h2>Find a patient</h2>
      <p class="subtitle">Search across every camp visit ever — by name, phone, email, or patient code.</p>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search…">
      </div>
      <div class="search-results" id="search-results"></div>
    </div>

    <div class="card" id="stall-actions-card">
      <h2>What do you want to do?</h2>
      <div class="stall-grid" id="stall-grid"></div>
    </div>

  </div>

  <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
