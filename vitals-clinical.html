<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Vitals — VITERA</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>
  <div class="navbar">
    <div class="brand">
      <img src="assets/images/logo.png" alt="VITERA">
      <span class="wordmark">VITERA<span class="dot">.</span></span>
    </div>
    <div class="nav-right">
      <a class="btn btn-text" href="dashboard.html">&larr; Dashboard</a>
      <button class="btn btn-text" id="logout-btn">Log out</button>
    </div>
  </div>

  <div class="container narrow">

    <div class="card">
      <h1>Clinical Vitals</h1>
      <p class="subtitle">Stall 3 — BP, blood sugar, temperature, and bone density (if a DEXA scan was done).</p>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search name, phone, or code…">
      </div>
      <div class="search-results" id="search-results"></div>
    </div>

    <div class="card hidden" id="form-card">
      <div class="patient-header">
        <div>
          <h2 id="p-name" style="color:var(--vt-text); margin-bottom:2px;"></h2>
          <div class="code" id="p-meta"></div>
        </div>
        <span class="status-pill" id="p-status"></span>
      </div>

      <div class="row">
        <div>
          <label for="systolic_bp">Systolic BP</label>
          <input type="number" id="systolic_bp">
        </div>
        <div>
          <label for="diastolic_bp">Diastolic BP</label>
          <input type="number" id="diastolic_bp">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="blood_sugar">Blood sugar</label>
          <input type="number" step="0.1" id="blood_sugar">
        </div>
        <div>
          <label for="blood_sugar_type">Blood sugar type</label>
          <select id="blood_sugar_type">
            <option value="">—</option>
            <option value="FASTING">Fasting</option>
            <option value="RANDOM">Random</option>
            <option value="POST_PRANDIAL">Post-prandial</option>
          </select>
        </div>
      </div>

      <label for="temperature_celsius">Temperature (°C)</label>
      <input type="number" step="0.1" id="temperature_celsius">

      <h3 style="margin-top:18px;">Bone density (DEXA) — only if a scan was done</h3>
      <div class="row">
        <div>
          <label for="bone_density_bmd">BMD (g/cm²)</label>
          <input type="number" step="0.001" id="bone_density_bmd">
        </div>
        <div>
          <label for="bone_density_site">Site</label>
          <input type="text" id="bone_density_site" placeholder="e.g. LUMBAR_SPINE, FEMUR_NECK, HIP">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="bone_density_t_score">T-score</label>
          <input type="number" step="0.01" id="bone_density_t_score">
        </div>
        <div>
          <label for="bone_density_z_score">Z-score</label>
          <input type="number" step="0.01" id="bone_density_z_score">
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="save-btn" style="margin-top:20px;">
        Save
      </button>
    </div>

  </div>

  <script type="module" src="assets/js/vitals-clinical.js"></script>
</body>
</html>
